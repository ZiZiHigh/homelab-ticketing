; Runtime hardening for osTicket. Mounted read-only into the PHP image.
; The entrypoint still writes its own zz-runtime.ini for memory, upload and TZ.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; PHP 8.3.33 bundles PCRE2 10.42. JIT stays off to reduce the
; CVE-2026-103111 attack surface. osTicket does not need JIT.
pcre.jit = 0

allow_url_fopen = Off
allow_url_include = Off

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
