# Reference copy of the live osTicket vhost.
# The live block is inside the http {} block in
# ~/homelab/nginx/nginx.conf. The project does not use HTTPS for osTicket.

server {
    listen 80;
    server_name tickets.home.arpa;

    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 25m;

    location / {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.88.0/24;
        deny all;

        set $osticket_upstream http://osticket:8080;
        proxy_pass $osticket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
